{% extends "base.html" %}
{% block title %}SQL_NB - SQL查询{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h4 class="mb-3"><i class="bi bi-code-square me-2"></i>SQL查询</h4>
    </div>
</div>

<div class="row">
    <!-- 左侧：SQL编辑器 -->
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="bi bi-pencil me-1"></i>SQL编辑器</span>
                <div class="d-flex align-items-center gap-2">
                    <select class="form-select form-select-sm" id="scenarioSelector" style="width:auto;min-width:120px;">
                        <option value="">不使用假设参数</option>
                    </select>
                    <select class="form-select form-select-sm" id="tableSelector" style="width:auto;min-width:120px;">
                        <option value="">快速插入表名</option>
                    </select>
                    <button class="btn btn-outline-secondary btn-tool" onclick="clearEditor()" title="清空">
                        <i class="bi bi-eraser"></i>
                    </button>
                    <button class="btn btn-primary btn-tool" onclick="executeSql()">
                        <i class="bi bi-play-fill"></i> 执行
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <textarea id="sqlEditor" class="sql-editor w-100 p-3" rows="8"
                    placeholder="在此输入SQLite查询语句...&#10;&#10;示例:&#10;SELECT * FROM 表名 LIMIT 10;&#10;SELECT COUNT(*) FROM 表名;&#10;SELECT 字段1, SUM(字段2) FROM 表名 GROUP BY 字段1;">SELECT * FROM </textarea>
            </div>
            <div class="status-bar d-flex justify-content-between">
                <span id="editorStatus">就绪</span>
                <span>
                    <button class="btn btn-link btn-sm text-decoration-none p-0 me-2" onclick="saveSqlTemplate()">
                        <i class="bi bi-bookmark"></i> 保存模板
                    </button>
                    <button class="btn btn-link btn-sm text-decoration-none p-0" onclick="loadSqlTemplate()">
                        <i class="bi bi-bookmark-fill"></i> 加载模板
                    </button>
                </span>
            </div>
        </div>

        <!-- 查询结果 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="bi bi-table me-1"></i>查询结果</span>
                <div class="d-flex align-items-center gap-2">
                    <span id="resultSummary" class="text-muted small"></span>
                    <button class="btn btn-success btn-tool" onclick="exportResult()" id="exportBtn" disabled>
                        <i class="bi bi-download"></i> 导出Excel
                    </button>
                    <button class="btn btn-info btn-tool" onclick="toggleChartPanel()" id="chartToggleBtn" disabled>
                        <i class="bi bi-graph-up"></i> 图表
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="resultArea" class="table-container" style="min-height:200px;max-height:500px;overflow:auto;">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-arrow-up-circle" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
                        在上方输入SQL语句，点击「执行」查看结果
                    </div>
                </div>
            </div>
            <!-- 分页 -->
            <div id="paginationArea" class="d-none p-2 d-flex justify-content-between align-items-center border-top">
                <small class="text-muted" id="pageInfo"></small>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>

        <!-- 图表面板 -->
        <div class="card d-none" id="chartPanel">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-graph-up me-1"></i>数据可视化</span>
                <div>
                    <select class="form-select form-select-sm d-inline-block" id="chartType" style="width:auto;min-width:100px;">
                        <option value="bar">柱状图</option>
                        <option value="line">折线图</option>
                        <option value="pie">饼图</option>
                        <option value="doughnut">环形图</option>
                    </select>
                    <select class="form-select form-select-sm d-inline-block ms-1" id="chartXCol" style="width:auto;min-width:100px;">
                        <option value="">X轴/标签</option>
                    </select>
                    <select class="form-select form-select-sm d-inline-block ms-1" id="chartYCol" style="width:auto;min-width:100px;">
                        <option value="">Y轴/数值</option>
                    </select>
                    <div class="form-check form-check-inline ms-1" style="font-size:0.82rem;">
                        <input class="form-check-input" type="checkbox" id="chartAggregate" checked>
                        <label class="form-check-label" for="chartAggregate">分类汇总</label>
                    </div>
                    <button class="btn btn-outline-primary btn-tool ms-1" onclick="renderChart()">
                        <i class="bi bi-graph-up"></i> 绘图
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="queryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：数据库信息 -->
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-info-circle me-1"></i>当前数据库
            </div>
            <div class="card-body" id="dbInfoPanel">
                <div class="text-center text-muted py-3">
                    <i class="bi bi-database" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
                    请先在「数据导入」页上传Excel
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="bi bi-clock-history me-1"></i>历史查询
            </div>
            <div class="card-body p-0">
                <div id="historyList" class="p-2">
                    <div class="text-center text-muted small py-3">暂无历史记录</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // ============ 状态变量 ============
    let currentResult = null;
    let currentMultiResults = null;  // 多条语句结果数组
    let currentMultiIndex = 0;       // 当前查看的结果索引
    let currentPage = 1;
    let chartInstance = null;
    let exportConfig = null;         // EXPORT 指令配置 {filename, path, sheet_names}
    let queryHistory = JSON.parse(localStorage.getItem('sql_nb_history') || '[]');

    // ============ 初始化 ============
    document.addEventListener('DOMContentLoaded', function() {
        loadTableList();
        loadScenarios();
        renderHistory();
        loadLastSql();
    });

    // ============ 加载表列表 ============
    async function loadTableList() {
        const selector = document.getElementById('tableSelector');
        const dbInfo = document.getElementById('dbInfoPanel');
        const dbName = document.getElementById('currentDbName').textContent;
        if (!dbName) return;

        try {
            const resp = await fetch(`/api/databases/${dbName}/info`);
            const data = await resp.json();

            if (data.tables && data.tables.length > 0) {
                // 填充表选择器
                selector.innerHTML = '<option value="">快速插入表名</option>';
                data.tables.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t[0];
                    opt.textContent = `${t[0]} (${t[1]}列, ${t[2]}行)`;
                    selector.appendChild(opt);
                });
                selector.onchange = function() {
                    if (this.value) {
                        insertTableName(this.value);
                        this.value = '';
                    }
                };

                // 填充数据库信息
                let html = `<div class="small"><strong>${dbName}</strong></div><ul class="list-unstyled small mt-2 mb-0">`;
                data.tables.forEach(t => {
                    html += `<li class="py-1 border-bottom">
                        <i class="bi bi-table me-1"></i>${t[0]}
                        <span class="text-muted ms-2">${t[1]}列 / ${formatNumber(t[2])}行</span>
                    </li>`;
                });
                html += '</ul>';
                dbInfo.innerHTML = html;
            } else {
                dbInfo.innerHTML = `<div class="text-muted small text-center py-2">数据库中暂无表</div>`;
            }
        } catch(e) {
            console.error('加载表列表失败:', e);
        }
    }

    // ============ 加载假设方案 ============
    async function loadScenarios() {
        try {
            const resp = await fetch('/api/hypothesis/scenarios');
            const data = await resp.json();
            const selector = document.getElementById('scenarioSelector');
            selector.innerHTML = '<option value="">不使用假设参数</option>';
            data.scenarios.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name;
                selector.appendChild(opt);
            });
        } catch(e) {}
    }

    // ============ 插入表名 ============
    function insertTableName(name) {
        const ta = document.getElementById('sqlEditor');
        const cursorPos = ta.selectionStart;
        const text = ta.value;
        ta.value = text.slice(0, cursorPos) + `"${name}"` + text.slice(cursorPos);
        ta.focus();
    }

    // ============ SQL编辑器操作 ============
    function clearEditor() {
        document.getElementById('sqlEditor').value = '';
        document.getElementById('editorStatus').textContent = '已清空';
    }

    function saveSqlTemplate() {
        const sql = document.getElementById('sqlEditor').value.trim();
        if (!sql) { showToast('请输入SQL语句', 'warning'); return; }
        const name = prompt('请为这个SQL模板命名:');
        if (!name) return;
        const templates = JSON.parse(localStorage.getItem('sql_nb_templates') || '[]');
        templates.push({name, sql, time: new Date().toLocaleString()});
        localStorage.setItem('sql_nb_templates', JSON.stringify(templates));
        showToast(`模板 "${name}" 已保存`, 'success');
    }

    function loadSqlTemplate() {
        const templates = JSON.parse(localStorage.getItem('sql_nb_templates') || '[]');
        if (templates.length === 0) {
            showToast('暂无保存的模板', 'info');
            return;
        }
        let options = templates.map((t, i) => `${i+1}. ${t.name}`);
        const choice = prompt(`选择要加载的模板:\n${options.join('\n')}\n\n输入编号:`);
        if (!choice) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < templates.length) {
            document.getElementById('sqlEditor').value = templates[idx].sql;
            document.getElementById('editorStatus').textContent = `已加载: ${templates[idx].name}`;
            showToast(`已加载模板: ${templates[idx].name}`, 'success');
        }
    }

    function loadLastSql() {
        const last = localStorage.getItem('sql_nb_last_sql');
        if (last) {
            document.getElementById('sqlEditor').value = last;
        }
    }

    // ============ 执行SQL ============
    async function executeSql(page = 1) {
        const sql = document.getElementById('sqlEditor').value.trim();
        if (!sql) {
            showToast('请输入SQL语句', 'warning');
            return;
        }

        const dbName = document.getElementById('currentDbName').textContent;
        if (!dbName) {
            showToast('请先上传Excel文件并选择数据库', 'warning');
            return;
        }

        const scenarioId = document.getElementById('scenarioSelector').value;

        // 保存到最后使用的SQL
        localStorage.setItem('sql_nb_last_sql', sql);

        // 添加到历史
        addHistory(sql);

        const btn = document.querySelector('.btn-primary');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split"></i> 执行中...';

        document.getElementById('editorStatus').textContent = '执行中...';

        try {
            const resp = await fetch('/api/query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sql: sql,
                    db_name: dbName,
                    scenario_id: scenarioId || undefined,
                    page: page,
                    page_size: 100
                })
            });
            const data = await resp.json();

            exportConfig = data.export_config || null;

            if (data.multi) {
                // 多条语句结果
                currentMultiResults = data.results;
                currentMultiIndex = 0;
                currentResult = null;
                displayMultiResult();
                const totalRows = data.results.reduce((sum, r) => sum + (r.success ? r.total_rows : 0), 0);
                const failed = data.results.filter(r => !r.success).length;
                document.getElementById('editorStatus').textContent =
                    `✓ 成功 ${data.results.length} 条语句 | ${formatNumber(totalRows)} 行` +
                    (failed ? ` | ${failed} 条失败` : '');
            } else {
                currentResult = data;
                currentMultiResults = null;
                currentPage = page;

                if (data.success) {
                    displayResult(data);
                    document.getElementById('editorStatus').textContent =
                        `✓ 成功 | ${formatNumber(data.total_rows)} 行 | ${data.total_pages} 页`;
                } else {
                    document.getElementById('resultArea').innerHTML =
                        `<div class="alert alert-danger m-3">${data.error}</div>`;
                    document.getElementById('editorStatus').textContent = '✗ 执行失败';
                    document.getElementById('paginationArea').classList.add('d-none');
                    document.getElementById('exportBtn').disabled = true;
                    document.getElementById('chartToggleBtn').disabled = true;
                }
            }
        } catch(e) {
            document.getElementById('resultArea').innerHTML =
                `<div class="alert alert-danger m-3">请求失败: ${e.message}</div>`;
            document.getElementById('editorStatus').textContent = '✗ 请求失败';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-play-fill"></i> 执行';
        }
    }

    // ============ 显示结果 ============
    function displayResult(data) {
        if (!data.columns || data.columns.length === 0) {
            document.getElementById('resultArea').innerHTML =
                '<div class="alert alert-info m-3">查询完成，无返回数据</div>';
            document.getElementById('paginationArea').classList.add('d-none');
            document.getElementById('exportBtn').disabled = true;
            document.getElementById('chartToggleBtn').disabled = true;
            return;
        }

        let html = '<table class="table table-hover table-striped mb-0"><thead><tr>';
        data.columns.forEach(col => {
            html += `<th>${escapeHtml(col)}</th>`;
        });
        html += '</tr></thead><tbody>';

        if (data.rows.length === 0) {
            html += '<tr><td colspan="' + data.columns.length + '" class="text-center text-muted">无匹配数据</td></tr>';
        } else {
            data.rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    html += `<td>${escapeHtml(cell)}</td>`;
                });
                html += '</tr>';
            });
        }
        html += '</tbody></table>';

        if (data.scenario_name) {
            html += `<div class="status-bar"><i class="bi bi-sliders me-1"></i>使用假设方案: ${data.scenario_name}</div>`;
        }

        document.getElementById('resultArea').innerHTML = html;

        // 分页
        if (data.total_pages > 1) {
            document.getElementById('paginationArea').classList.remove('d-none');
            document.getElementById('pageInfo').textContent =
                `第 ${data.page}/${data.total_pages} 页 (共 ${formatNumber(data.total_rows)} 条)`;

            let pgHtml = '';
            pgHtml += `<li class="page-item ${data.page <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="executeSql(1)">&laquo;</a></li>`;
            pgHtml += `<li class="page-item ${data.page <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="executeSql(${data.page - 1})">&lsaquo;</a></li>`;

            const startPage = Math.max(1, data.page - 2);
            const endPage = Math.min(data.total_pages, startPage + 4);
            for (let i = startPage; i <= endPage; i++) {
                pgHtml += `<li class="page-item ${i === data.page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="executeSql(${i})">${i}</a></li>`;
            }

            pgHtml += `<li class="page-item ${data.page >= data.total_pages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="executeSql(${data.page + 1})">&rsaquo;</a></li>`;
            pgHtml += `<li class="page-item ${data.page >= data.total_pages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="executeSql(${data.total_pages})">&raquo;</a></li>`;

            document.getElementById('pagination').innerHTML = pgHtml;
        } else {
            document.getElementById('paginationArea').classList.add('d-none');
        }

        // 启用导出和图表
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('chartToggleBtn').disabled = false;

        // 更新图表列选择
        const xCol = document.getElementById('chartXCol');
        const yCol = document.getElementById('chartYCol');
        xCol.innerHTML = '<option value="">X轴/标签</option>';
        yCol.innerHTML = '<option value="">Y轴/数值</option>';
        data.columns.forEach((col, idx) => {
            xCol.innerHTML += `<option value="${idx}">${escapeHtml(col)}</option>`;
            yCol.innerHTML += `<option value="${idx}">${escapeHtml(col)}</option>`;
        });
    }

    // ============ 多结果集展示 ============
    function displayMultiResult() {
        if (!currentMultiResults || currentMultiResults.length === 0) {
            document.getElementById('resultArea').innerHTML =
                '<div class="alert alert-info m-3">无查询结果</div>';
            document.getElementById('paginationArea').classList.add('d-none');
            document.getElementById('exportBtn').disabled = true;
            document.getElementById('chartToggleBtn').disabled = true;
            return;
        }

        // 生成 Tab 导航（优先使用 EXPORT 定义的 Sheet 名）
        let html = '<ul class="nav nav-tabs small" style="position:sticky;top:0;z-index:10;background:#fff;">';
        currentMultiResults.forEach((r, i) => {
            const customName = exportConfig?.sheet_names?.[String(i)];
            const tabLabel = customName || `结果${i+1}`;
            const label = r.success
                ? `${tabLabel} <span class="badge bg-secondary">${formatNumber(r.total_rows)}行</span>`
                : `${tabLabel} <span class="badge bg-danger">失败</span>`;
            html += `<li class="nav-item">
                <a class="nav-link ${i === currentMultiIndex ? 'active' : ''}" href="#"
                   onclick="switchResultTab(${i});return false;" style="padding:0.4rem 0.8rem;font-size:0.85rem;">
                   ${label}
                </a>
            </li>`;
        });
        html += '</ul>';
        html += '<div id="multiResultContent"></div>';
        document.getElementById('resultArea').innerHTML = html;

        document.getElementById('paginationArea').classList.add('d-none');
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('chartToggleBtn').disabled = false;

        renderCurrentMultiTab();
    }

    function switchResultTab(index) {
        currentMultiIndex = index;
        renderCurrentMultiTab();
    }

    function renderCurrentMultiTab() {
        const data = currentMultiResults[currentMultiIndex];
        const container = document.getElementById('multiResultContent');
        if (!container) return;

        if (!data.success) {
            container.innerHTML = `<div class="alert alert-danger m-3">${data.error}</div>`;
            return;
        }

        if (!data.columns || data.columns.length === 0) {
            container.innerHTML = '<div class="alert alert-info m-3">查询完成，无返回数据</div>';
            return;
        }

        let html = '<div class="table-container" style="max-height:450px;overflow:auto;">';
        html += '<table class="table table-hover table-striped mb-0"><thead><tr>';
        data.columns.forEach(col => {
            html += `<th>${escapeHtml(col)}</th>`;
        });
        html += '</tr></thead><tbody>';

        if (data.rows.length === 0) {
            html += `<tr><td colspan="${data.columns.length}" class="text-center text-muted">无匹配数据</td></tr>`;
        } else {
            data.rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    html += `<td>${escapeHtml(cell)}</td>`;
                });
                html += '</tr>';
            });
        }
        html += '</tbody></table></div>';

        if (data.scenario_name) {
            html += `<div class="status-bar"><i class="bi bi-sliders me-1"></i>使用假设方案: ${data.scenario_name}</div>`;
        }

        // SQL 预览
        if (data.sql_preview) {
            html += `<div class="small text-muted px-3 py-1 border-top"><i class="bi bi-code-slash me-1"></i>${escapeHtml(data.sql_preview)}</div>`;
        }

        container.innerHTML = html;

        // 更新图表列选择（使用当前结果）
        currentResult = data;

        const xCol = document.getElementById('chartXCol');
        const yCol = document.getElementById('chartYCol');
        xCol.innerHTML = '<option value="">X轴/标签</option>';
        yCol.innerHTML = '<option value="">Y轴/数值</option>';
        data.columns.forEach((col, idx) => {
            xCol.innerHTML += `<option value="${idx}">${escapeHtml(col)}</option>`;
            yCol.innerHTML += `<option value="${idx}">${escapeHtml(col)}</option>`;
        });
    }

    // ============ 图表 ============
    function toggleChartPanel() {
        const panel = document.getElementById('chartPanel');
        panel.classList.toggle('d-none');
    }

    function renderChart() {
        if (!currentResult || !currentResult.success) return;

        const xIdx = parseInt(document.getElementById('chartXCol').value);
        const yIdx = parseInt(document.getElementById('chartYCol').value);
        const chartType = document.getElementById('chartType').value;
        const aggregate = document.getElementById('chartAggregate').checked;

        if (isNaN(xIdx) || isNaN(yIdx)) {
            showToast('请选择X轴和Y轴列', 'warning');
            return;
        }

        let labels, values;

        if (aggregate) {
            // 分类汇总：按X列分组，对Y列求和
            const groups = {};
            currentResult.rows.forEach(row => {
                const key = String(row[xIdx] ?? '(空)');
                const val = parseFloat(row[yIdx]);
                if (!isNaN(val)) {
                    groups[key] = (groups[key] || 0) + val;
                }
            });
            // 按标签排序
            const sorted = Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0], 'zh-CN'));
            labels = sorted.map(entry => entry[0]);
            values = sorted.map(entry => entry[1]);
        } else {
            labels = currentResult.rows.map(row => String(row[xIdx] ?? ''));
            values = currentResult.rows.map(row => {
                const v = parseFloat(row[yIdx]);
                return isNaN(v) ? 0 : v;
            });
        }

        const ctx = document.getElementById('queryChart').getContext('2d');

        if (chartInstance) {
            chartInstance.destroy();
        }

        const colors = ['#4fc3f7', '#a78bfa', '#f97316', '#22c55e', '#ef4444', '#eab308',
                       '#ec4899', '#14b8a6', '#6366f1', '#f43f5e'];

        // 数据集颜色：每个数据项独立颜色（柱状图也循环使用色板）
        const fillColors = chartType === 'pie' || chartType === 'doughnut'
            ? colors.slice(0, values.length)
            : values.map((_, i) => colors[i % colors.length]);

        const isBarOrLine = chartType === 'bar' || chartType === 'line';
        const isPieOrDoughnut = chartType === 'pie' || chartType === 'doughnut';

        const config = {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: currentResult.columns[yIdx] || '值',
                    data: values,
                    backgroundColor: fillColors,
                    borderColor: colors[0],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: isPieOrDoughnut },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                return `${ctx.label}: ${formatNumber(ctx.raw)}`;
                            }
                        }
                    },
                    // 数据标签：不同图表类型不同样式
                    datalabels: isBarOrLine ? {
                        display: true,
                        anchor: 'end',
                        align: 'end',
                        color: 'white',
                        backgroundColor: function(context) {
                            return fillColors[context.dataIndex];
                        },
                        borderRadius: 4,
                        padding: { top: 4, bottom: 4, left: 6, right: 6 },
                        font: { weight: 'bold', size: 11 },
                        formatter: function(value) {
                            return formatNumber(value);
                        }
                    } : isPieOrDoughnut ? {
                        display: true,
                        color: 'white',
                        font: { weight: 'bold', size: 11 },
                        formatter: function(value, context) {
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const pct = ((value / total) * 100).toFixed(1);
                            const label = context.chart.data.labels[context.dataIndex];
                            return `${label}\n${formatNumber(value)}\n(${pct}%)`;
                        }
                    } : {}
                },
                scales: isBarOrLine ? {
                    y: { beginAtZero: true }
                } : undefined
            }
        };

        chartInstance = new Chart(ctx, config);
        document.getElementById('chartPanel').classList.remove('d-none');
    }

    // ============ 导出Excel ============
    async function exportResult() {
        let exportData;

        if (currentMultiResults && currentMultiResults.length > 0) {
            // 多结果集：全部导出（优先使用 EXPORT 定义的 Sheet 名）
            exportData = currentMultiResults.map((r, i) => {
                const customName = exportConfig?.sheet_names?.[String(i)];
                const sheetName = customName || `结果${i+1}`;
                return {
                    sheet_name: sheetName.slice(0, 31),
                    columns: r.columns || [],
                    rows: r.rows || []
                };
            });
        } else if (currentResult && currentResult.success && currentResult.columns) {
            // 单结果集：优先使用 EXPORT 定义的 sheet_name
            const defaultName = exportConfig?.sheet_name || '查询结果';
            const sheetName = prompt('请输入Sheet名称(默认: ' + defaultName + '):') || defaultName;
            exportData = [{
                sheet_name: sheetName.slice(0, 31),
                columns: currentResult.columns,
                rows: currentResult.rows
            }];
        } else {
            showToast('没有可导出的结果', 'warning');
            return;
        }

        try {
            // 构建请求体，传入 export_config
            const body = { results: exportData };
            if (exportConfig) {
                body.export_config = {
                    filename: exportConfig.filename,
                    path: exportConfig.path
                };
            }

            const resp = await fetch('/api/query/export', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (data.success) {
                // 下载文件
                const a = document.createElement('a');
                a.href = data.download_url;
                a.download = data.filename;
                a.click();

                let msg = '导出成功！';
                if (data.saved_path) {
                    msg += `<br><small class="text-muted">已保存到: ${data.saved_path}</small>`;
                }
                if (data.path_warning) {
                    msg += `<br><small class="text-warning">⚠ ${data.path_warning}</small>`;
                }
                showToast(msg, 'success');
            } else {
                showToast('导出失败: ' + data.error, 'error');
            }
        } catch(e) {
            showToast('导出失败: ' + e.message, 'error');
        }
    }

    // ============ 查询历史 ============
    function addHistory(sql) {
        const item = {sql, time: new Date().toLocaleString()};
        queryHistory.unshift(item);
        if (queryHistory.length > 20) queryHistory.pop();
        localStorage.setItem('sql_nb_history', JSON.stringify(queryHistory));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (queryHistory.length === 0) {
            container.innerHTML = '<div class="text-center text-muted small py-3">暂无历史记录</div>';
            return;
        }
        let html = '';
        queryHistory.forEach((item, i) => {
            const shortSql = item.sql.length > 60 ? item.sql.slice(0, 60) + '...' : item.sql;
            html += `<div class="border-bottom py-1 small" style="cursor:pointer;"
                onclick="loadHistorySql(${i})" title="${escapeHtml(item.sql)}">
                <div class="text-truncate">${escapeHtml(shortSql)}</div>
                <div class="text-muted" style="font-size:0.75rem;">${item.time}</div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function loadHistorySql(idx) {
        if (idx >= 0 && idx < queryHistory.length) {
            document.getElementById('sqlEditor').value = queryHistory[idx].sql;
            showToast('已加载历史SQL', 'info');
        }
    }

    // ============ 快捷键 ============
    document.addEventListener('keydown', function(e) {
        // Ctrl+Enter 或 Cmd+Enter 执行SQL
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            executeSql();
        }
    });

    // 页面刷新时重载表列表
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            loadTableList();
            loadScenarios();
        }
    });
</script>
{% endblock %}
