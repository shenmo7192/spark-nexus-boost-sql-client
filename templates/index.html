{% extends "base.html" %}
{% block title %}SQL_NB - 数据导入{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h4 class="mb-3"><i class="bi bi-upload me-2"></i>数据导入</h4>
    </div>
</div>

<div class="row">
    <!-- 上传区域 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-cloud-upload me-1"></i>上传Excel文件
                <span class="badge bg-secondary ms-2" style="font-size:0.7rem;">.xlsx / .xls</span>
            </div>
            <div class="card-body">
                <div class="drop-zone" id="dropZone">
                    <i class="bi bi-file-earmark-excel"></i>
                    <p class="mt-2 mb-1 fw-medium">拖拽Excel文件到此处</p>
                    <p class="text-muted small mb-2">或点击选择文件</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" style="display:none;" multiple>
                    <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-folder2-open me-1"></i>选择文件
                    </button>
                    <p class="text-muted small mt-2 mb-0">支持十万行级大数据，自动转换为SQLite数据库</p>
                </div>
                <div id="uploadProgress" class="mt-3 d-none">
                    <div class="progress" style="height:6px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div>
                    </div>
                    <p class="small text-muted mt-1 mb-0">正在处理...</p>
                </div>
                <div id="uploadResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- 数据库管理 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-database me-1"></i>数据库管理</span>
                <button class="btn btn-outline-danger btn-tool" onclick="deleteCurrentDb()">
                    <i class="bi bi-trash"></i> 删除当前库
                </button>
            </div>
            <div class="card-body p-0">
                <div id="dbListContainer" class="p-3">
                    <div class="text-center text-muted py-3">
                        <i class="bi bi-database" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
                        暂无数据库，请上传Excel文件
                    </div>
                </div>
            </div>
        </div>

        <!-- 表结构预览 -->
        <div class="card d-none" id="tablePreviewCard">
            <div class="card-header">
                <i class="bi bi-table me-1"></i>表结构预览
                <span id="previewTableName" class="badge bg-primary ms-2"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-container" id="tablePreviewContent"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // ============ 拖拽上传 ============
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadProgress = document.getElementById('uploadProgress');
    const uploadResult = document.getElementById('uploadResult');

    // 拖拽事件
    ['dragenter', 'dragover'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    });
    ['dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
    });
    dropZone.addEventListener('drop', e => {
        const files = e.dataTransfer.files;
        if (files.length > 0) handleFiles(files);
    });

    // 点击选择文件
    fileInput.addEventListener('change', e => {
        if (e.target.files.length > 0) handleFiles(e.target.files);
    });

    async function handleFiles(files) {
        uploadProgress.classList.remove('d-none');
        uploadResult.innerHTML = '';

        const formData = new FormData();
        let validCount = 0;
        for (const file of files) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (['xlsx', 'xls', 'xlsm'].includes(ext)) {
                formData.append('files[]', file);
                validCount++;
            }
        }

        if (validCount === 0) {
            uploadProgress.classList.add('d-none');
            uploadResult.innerHTML = '<div class="alert alert-danger">请选择有效的Excel文件</div>';
            return;
        }

        try {
            const resp = await fetch('/api/upload/multiple', {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();

            uploadProgress.classList.add('d-none');

            if (data.success) {
                let html = '<div class="alert alert-success">上传完成！</div><ul class="list-group list-group-flush">';
                data.results.forEach(r => {
                    if (r.success) {
                        html += `<li class="list-group-item py-2">
                            <i class="bi bi-check-circle-fill text-success me-2"></i>
                            <strong>${r.db_name}</strong>
                            <span class="text-muted small ms-2">表: ${r.table_name} | ${formatNumber(r.row_count)}行</span>
                        </li>`;
                    } else {
                        html += `<li class="list-group-item py-2">
                            <i class="bi bi-x-circle-fill text-danger me-2"></i>
                            <strong>${r.db_name}</strong>
                            <span class="text-danger small ms-2">${r.error}</span>
                        </li>`;
                    }
                });
                html += '</ul>';
                uploadResult.innerHTML = html;
                refreshSidebarDbList();
                refreshDbList();
            } else {
                uploadResult.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        } catch(e) {
            uploadProgress.classList.add('d-none');
            uploadResult.innerHTML = `<div class="alert alert-danger">上传失败: ${e.message}</div>`;
        }

        fileInput.value = '';
        // 自动切换到第一个成功的数据库
        setTimeout(() => refreshDbList(), 500);
    }

    // ============ 数据库列表 ============
    async function refreshDbList() {
        try {
            const resp = await fetch('/api/databases');
            const data = await resp.json();
            const container = document.getElementById('dbListContainer');

            if (!data.databases || data.databases.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-3">
                        <i class="bi bi-database" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
                        暂无数据库，请上传Excel文件
                    </div>
                `;
                document.getElementById('tablePreviewCard').classList.add('d-none');
                return;
            }

            let html = '<div class="list-group list-group-flush">';
            data.databases.forEach(db => {
                const isActive = document.getElementById('currentDbName').textContent === db.name;
                html += `
                    <div class="list-group-item list-group-item-action py-2 ${isActive ? 'active' : ''}"
                         style="cursor:pointer;" onclick="selectDb('${db.name}')">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <i class="bi bi-database me-2"></i>
                                <strong>${db.name}</strong>
                                <span class="badge badge-db ms-2">${db.tables.length} 表</span>
                            </div>
                            <small class="text-muted">${db.size_display}</small>
                        </div>
                        <div class="small text-muted mt-1">
                            表: ${db.tables.join(', ') || '无'}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        } catch(e) {
            console.error('刷新数据库列表失败:', e);
        }
    }

    async function selectDb(dbName) {
        await setCurrentDb(dbName);
        refreshDbList();

        // 预览第一张表
        try {
            const resp = await fetch(`/api/databases/${dbName}/info`);
            const data = await resp.json();
            if (data.tables && data.tables.length > 0) {
                const tableName = data.tables[0][0];
                previewTable(dbName, tableName);
            }
        } catch(e) {}
    }

    async function previewTable(dbName, tableName) {
        try {
            const resp = await fetch(`/api/databases/${dbName}/tables/${tableName}/preview`);
            const data = await resp.json();
            const card = document.getElementById('tablePreviewCard');
            card.classList.remove('d-none');
            document.getElementById('previewTableName').textContent = `${dbName} > ${tableName}`;

            if (!data.success) {
                document.getElementById('tablePreviewContent').innerHTML =
                    `<div class="p-3 text-danger">${data.error}</div>`;
                return;
            }

            let html = '<table class="table table-hover table-striped mb-0"><thead><tr>';
            data.columns.forEach(col => {
                html += `<th>${escapeHtml(col)}</th>`;
            });
            html += '</tr></thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    html += `<td>${escapeHtml(cell)}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            html += `<div class="status-bar">前 ${data.total_rows} 行预览 | 共 ${data.total_rows} 行</div>`;
            document.getElementById('tablePreviewContent').innerHTML = html;
        } catch(e) {
            console.error('预览表失败:', e);
        }
    }

    async function deleteCurrentDb() {
        const dbName = document.getElementById('currentDbName').textContent;
        if (!dbName) {
            showToast('请先选择要删除的数据库', 'warning');
            return;
        }
        if (!confirm(`确定要删除数据库 "${dbName}" 吗？此操作不可恢复。`)) return;

        try {
            const resp = await fetch(`/api/databases/${dbName}/delete`, { method: 'DELETE' });
            const data = await resp.json();
            if (data.success) {
                showToast(`数据库 "${dbName}" 已删除`, 'success');
                const badge = document.getElementById('currentDbBadge');
                badge.classList.add('d-none');
                document.getElementById('currentDbName').textContent = '';
                refreshSidebarDbList();
                refreshDbList();
                document.getElementById('tablePreviewCard').classList.add('d-none');
            }
        } catch(e) {
            showToast('删除失败', 'error');
        }
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(refreshDbList, 300);
    });
</script>
{% endblock %}
