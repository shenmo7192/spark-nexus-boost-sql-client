name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux: 安装 fpm/xz/dpkg 等原生依赖
      - name: Setup Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils dpkg-dev libarchive-tools \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 \
            libgbm1

      # Windows: 确保临时目录在 C 盘，避免某些工具尝试写 D: 导致 ENOENT
      - name: Ensure temp dir on C:
        if: matrix.target == 'win'
        run: |
          mkdir -Force C:\tmp
          echo "TMP=C:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "TEMP=C:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 缓存 electron 与 electron-builder 工具二进制下载（按 arch 分桶）
      - name: Cache electron/builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-eb26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-eb26-

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Debug runner arch
        if: matrix.target == 'linux'
        run: |
          echo "uname -m: $(uname -m)"
          echo "node arch: $(node -p process.arch)"

      - name: Package
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
