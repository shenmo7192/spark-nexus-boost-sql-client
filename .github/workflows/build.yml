name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux: 安装 fpm/xz/dpkg 等原生依赖；
      # electron-builder v26 默认会下载与 runner arch 匹配的 fpm 1.17.0，
      # 但 xz-utils / dpkg-dev 仍是系统依赖，且可作为 USE_SYSTEM_FPM 兜底
      - name: Setup Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils dpkg-dev libarchive-tools \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 \
            libgbm1 libasound2

      # 缓存 electron 与 electron-builder 工具二进制下载（按 arch 分桶）
      - name: Cache electron/builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-eb26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-eb26-

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Debug runner arch
        if: matrix.target == 'linux'
        run: |
          echo "uname -m: $(uname -m)"
          echo "node arch: $(node -p process.arch)"
          echo "fpm cache dir:" && ls -la ~/.cache/electron-builder/fpm/ 2>/dev/null || true

      - name: Package
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }}

      # 校验产物的 ELF 架构，防止 arm64 包里再混入 x86-64 二进制
      - name: Verify binary arch (Linux)
        if: matrix.target == 'linux'
        run: |
          set -e
          for d in release/*.deb; do
            [ -f "$d" ] || continue
            echo "==> $d"
            tmpdir=$(mktemp -d)
            dpkg-deb -x "$d" "$tmpdir"
            # 找 chrome-sandbox 与主程序二进制，断言 ELF 架构与目标 arch 匹配
            bin=$(find "$tmpdir" -type f \( -name 'chrome-sandbox' -o -name '星火汇速SQL客户端' \) | head -1)
            if [ -n "$bin" ]; then
              file "$bin"
              if [ "${{ matrix.arch }}" = "arm64" ]; then
                file "$bin" | grep -q "aarch64" || { echo "ERROR: arm64 deb contains non-aarch64 binary"; exit 1; }
              else
                file "$bin" | grep -q "x86-64" || { echo "ERROR: x64 deb contains non-x86-64 binary"; exit 1; }
              fi
            fi
            # 同时校验 better_sqlite3.node 的架构
            node=$(find "$tmpdir" -name 'better_sqlite3.node' | head -1)
            if [ -n "$node" ]; then
              file "$node"
              if [ "${{ matrix.arch }}" = "arm64" ]; then
                file "$node" | grep -q "aarch64" || { echo "ERROR: arm64 deb contains non-aarch64 .node"; exit 1; }
              else
                file "$node" | grep -q "x86-64" || { echo "ERROR: x64 deb contains non-x86-64 .node"; exit 1; }
              fi
            fi
            rm -rf "$tmpdir"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
