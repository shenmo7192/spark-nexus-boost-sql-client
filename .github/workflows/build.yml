name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 缓存 electron 与 electron-builder 工具二进制下载，避免重复拉取
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-22.3.27

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }}

      # 校验产物的 ELF 架构，防止 arm64 包里再混入 x86-64 二进制
      - name: Verify binary arch (Linux)
        if: matrix.target == 'linux'
        run: |
          set -e
          for f in release/*.AppImage; do
            [ -f "$f" ] || continue
            echo "==> $f"
            # AppImage 是 squashfs，用 runtime 检查产物不可行，直接看 deb 内的 chrome-sandbox
          done
          for d in release/*.deb; do
            [ -f "$d" ] || continue
            echo "==> $d"
            tmpdir=$(mktemp -d)
            dpkg-deb -x "$d" "$tmpdir"
            bin=$(find "$tmpdir" -type f \( -name 'chrome-sandbox' -o -name '星火汇速SQL客户端' \) | head -1)
            if [ -n "$bin" ]; then
              file "$bin"
              if [ "${{ matrix.arch }}" = "arm64" ]; then
                file "$bin" | grep -q "aarch64" || { echo "ERROR: arm64 deb contains non-aarch64 binary"; exit 1; }
              else
                file "$bin" | grep -q "x86-64" || { echo "ERROR: x64 deb contains non-x86-64 binary"; exit 1; }
              fi
            fi
            rm -rf "$tmpdir"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
